name: working_radio
description: Working Radio — rádio global premium com neumorfismo, globo interativo e catálogo ampliado (Flutter).
publish_to: 'none'
version: 4.0.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.36
  http: ^1.2.1
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  # v3 — rádios globais + mapa + geolocalização
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# geolocator_android 4.6.2 quebra com Flutter 3.24 (plugin usa `flutter.*`
# em módulo de biblioteca). 4.6.1 é a última compatível.
dependency_overrides:
  geolocator_android: 4.6.1

flutter:
  uses-material-design: true
