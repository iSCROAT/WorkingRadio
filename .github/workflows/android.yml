# GitHub Actions — Working Radio v2 (Flutter)
# Build APK debug (artefato) a cada push + Release por tag v*.
name: Android CI/CD

on:
  push:
    branches: [main, 'arena/*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze || true

      - name: Build APK debug
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee /tmp/build.log

      - name: Salvar log do build (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn

      # Publica o erro como anotação de check-run (visível via API).
      - name: Anotar diagnóstico da falha
        if: failure()
        run: |
          set +e
          ERR=$(grep -iE "error:|FAILURE:|What went wrong|Caused by:|e: |Exception:" /tmp/build.log 2>/dev/null | head -n 12)
          if [ -z "$ERR" ]; then
            ERR=$(tail -n 25 /tmp/build.log 2>/dev/null)
          fi
          # escapa % e quebras de linha para o comando ::error::
          ESC=$(printf '%s' "$ERR" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build APK falhou::$ESC"

      - name: Upload APK (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  release:
    name: Release APK (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
